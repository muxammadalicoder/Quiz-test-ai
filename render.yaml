services:
  - type: web
    name: quiz-arena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOW_GUEST
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PDF_DAILY
        value: "5"
      - key: ADMIN_PASSWORD
        sync: false
      # AI muhandis: tuzatishlarni GitHub'ga yuborish uchun (ixtiyoriy)
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: DEVAI_AUTO_HOURS
        value: "6"
      # O'zbekcha server ovozi (ixtiyoriy; Groq o'zbekcha ovoz bermaydi)
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false
