services:
  - type: web
    name: quiz-arena
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: ALLOW_GUEST
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PDF_DAILY
        value: "5"
      - key: ADMIN_PASSWORD
        sync: false
